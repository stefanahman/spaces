# goreleaser v2 — `goreleaser check` validates, `goreleaser release --clean`
# runs on a v* tag (.github/workflows/release.yml).
version: 2

project_name: spaces

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: spaces
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^test:", "^ci:", "^build:", "^style:"]

# Homebrew cask in stefanahman/homebrew-tap: `brew install --cask stefanahman/tap/spaces`.
# Casks (not formulas) are what goreleaser recommends for prebuilt binaries;
# the binaries are unsigned, so a postflight step strips the quarantine
# attribute.
homebrew_casks:
  - name: spaces
    repository:
      owner: stefanahman
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/stefanahman/spaces
    description: "Hotkeys for tmux, herdr and cmux workspaces, pinned to desktop spaces"
    license: MIT
    binaries: [spaces]
    dependencies:
      - formula: tmux
    # yabai comes from a third-party tap (koekeishiya/formulae); not
    # declared here so the cask installs without it — `check` reports it.
    # Homebrew deprecated the postflight stanza and warns on every install
    # and upgrade. install_steps (goreleaser v2.19 and later) writes its
    # replacement, postflight_steps, in Homebrew's stanza order;
    # .StagedPath renders Homebrew's {{staged_path}} token.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/spaces"]
          end
